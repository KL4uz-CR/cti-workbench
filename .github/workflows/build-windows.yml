name: Build CTI Workbench Windows x64

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python sources
        run: |
          python -m compileall -q src packaging

      - name: Build CTI Workbench
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CTI-Workbench --paths src --collect-all keyring src/main.py

      - name: Build iocinfo
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name iocinfo packaging/iocinfo_entry.py

      - name: Smoke test iocinfo
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONIOENCODING = "utf-8"
          $env:NO_COLOR = "1"
          & .\dist\iocinfo.exe --help
          if ($LASTEXITCODE -ne 0) { throw "iocinfo smoke test failed" }

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/config | Out-Null
          Copy-Item dist/CTI-Workbench.exe release/
          Copy-Item dist/iocinfo.exe release/
          Copy-Item config/*.example release/config/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTI-Workbench-dev-win-x64
          path: release/
          if-no-files-found: error
          retention-days: 30
