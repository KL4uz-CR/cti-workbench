name: Build CTI Workbench Windows x64

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python sources
        run: |
          python -m compileall -q src

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build CTI Workbench
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/CTI-Workbench.spec

      - name: Smoke test the portable executable
        timeout-minutes: 5
        shell: pwsh
        run: |
          $directory = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "cti-portable")
          $executable = Copy-Item dist/CTI-Workbench.exe $directory -PassThru
          foreach ($language in @("en", "es", "pt_BR")) {
            $process = Start-Process -FilePath $executable.FullName -ArgumentList "--smoke-test", $language -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Portable smoke test failed for $language" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTI-Workbench-dev-win-x64
          path: dist/CTI-Workbench.exe
          if-no-files-found: error
          retention-days: 30
